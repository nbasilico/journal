<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Journal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfa; }
  @media (prefers-color-scheme: dark) { html, body { background: #17191c; } }
  iframe {
    display: block; border: 0; width: 100%; height: 100%;
    padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box;
  }
</style>
<script>
  // Sostituisci con l'URL della tua web app (termina con /exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbw_qUdlx59ZolM-Lc2OLxKTBStIHMeNHWiJzh7fHwhxMnTmUNSA68rTX-tnP-wR2DXgoQ/exec';

  // Su telefono e tablet il login dentro un iframe viene bloccato (errore 401):
  // lì apriamo direttamente l'app, con il banner. Sul computer la includiamo senza banner.
  const touch = window.matchMedia('(pointer: coarse)').matches ||
                /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (touch) location.replace(APP_URL);
</script>
</head>
<body>
<iframe id="app" title="Journal"></iframe>
<script>if (!touch) document.getElementById('app').src = APP_URL;</script>
</body>
</html>
